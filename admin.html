<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de administración | BLACK</title>
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#0b0b0c">
  <link rel="icon" type="image/png" href="assets/logo/favicon.png">
  <link rel="apple-touch-icon" href="assets/logo/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/config.js" defer></script>
  <script src="js/products-data.js" defer></script>
  <script src="js/store.js" defer></script>
  <script src="js/admin.js" defer></script>
</head>
<body data-page="admin" class="admin">

  <!-- Ingreso (Supabase Auth) -->
  <section class="adm-login" id="login" hidden>
    <form class="adm-login-card" id="login-form">
      <img class="brand-logo" src="assets/logo/logo.png" alt="BLACK Lubricentro" width="72" height="72">
      <h1>Administración</h1>
      <div class="field">
        <label for="adm-user">Email</label>
        <input id="adm-user" type="email" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="adm-pass">Contraseña</label>
        <input id="adm-pass" type="password" autocomplete="current-password">
      </div>
      <p class="form-error" id="login-error" role="alert"></p>
      <button class="btn btn-red btn-lg btn-block" type="submit">Ingresar</button>
    </form>
  </section>

  <!-- Panel -->
  <div id="app" hidden>
    <header class="adm-header">
      <div class="container adm-header-inner">
        <strong class="adm-title">BLACK · Administración</strong>
        <nav class="adm-actions" aria-label="Acciones">
          <a class="btn btn-line" href="index.html" target="_blank" rel="noopener">Ver tienda</a>
          <button class="btn btn-line" type="button" id="logout">Salir</button>
        </nav>
      </div>
    </header>

    <main class="container adm-main">
      <div class="adm-tabs" role="tablist" aria-label="Secciones">
        <button class="adm-tab is-active" role="tab" id="tab-productos" aria-selected="true" aria-controls="panel-productos" type="button">Productos</button>
        <button class="adm-tab" role="tab" id="tab-pedidos" aria-selected="false" aria-controls="panel-pedidos" type="button">Pedidos <span class="adm-count" id="orders-badge" hidden>0</span></button>
      </div>

      <section id="panel-productos" role="tabpanel" aria-labelledby="tab-productos">
        <div class="adm-toolbar">
          <label class="sr-only" for="prod-search">Buscar producto</label>
          <input class="select" id="prod-search" type="search" placeholder="Buscar producto" autocomplete="off">
          <div class="adm-toolbar-actions">
            <button class="btn btn-red" type="button" id="share-catalog"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 3v12M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>Compartir catálogo</button>
            <button class="btn btn-red" type="button" id="new-product">+ Nuevo producto</button>
          </div>
        </div>
        <p class="share-msg" id="share-msg" role="status" aria-live="polite"></p>
        <p class="result-count" id="prod-count" aria-live="polite"></p>
        <div class="adm-list" id="prod-list"></div>
      </section>

      <section id="panel-pedidos" role="tabpanel" aria-labelledby="tab-pedidos" hidden>
        <div class="adm-toolbar">
          <label class="sr-only" for="order-filter">Filtrar por estado</label>
          <select class="select" id="order-filter"></select>
        </div>
        <p class="result-count" id="order-count" aria-live="polite"></p>
        <div id="order-list"></div>
      </section>

    </main>
  </div>

  <!-- Formulario de producto -->
  <dialog class="adm-dialog" id="prod-dialog" aria-labelledby="prod-dialog-title">
    <form id="prod-form" novalidate>
      <h2 id="prod-dialog-title">Nuevo producto</h2>

      <div class="field">
        <label for="p-name">Nombre</label>
        <input id="p-name" name="name" type="text" required aria-describedby="p-err-name">
        <p class="field-error" id="p-err-name"></p>
      </div>
      <div class="field">
        <label for="p-desc">Descripción corta</label>
        <input id="p-desc" name="description" type="text" maxlength="120">
      </div>
      <div class="field-row">
        <div class="field">
          <label for="p-price">Precio ($)</label>
          <input id="p-price" name="price" type="number" min="0" step="1" inputmode="numeric" required aria-describedby="p-err-price">
          <p class="field-error" id="p-err-price"></p>
        </div>
        <div class="field">
          <label for="p-stock">Stock (unidades)</label>
          <input id="p-stock" name="stock" type="number" min="0" step="1" inputmode="numeric" required aria-describedby="p-err-stock">
          <p class="field-error" id="p-err-stock"></p>
        </div>
      </div>
      <div class="field">
        <label for="p-cat">Categoría</label>
        <select class="select" id="p-cat" name="category"></select>
      </div>

      <div class="field">
        <span class="label">Imagen</span>
        <div class="adm-img">
          <div class="c-thumb" id="p-preview"></div>
          <div>
            <label class="btn btn-line adm-file">Elegir foto<input id="p-file" type="file" accept="image/*"></label>
            <button class="link-btn" type="button" id="p-img-remove" hidden>Quitar foto</button>
            <p class="fine" id="p-img-msg">Sin foto se muestra un envase genérico.</p>
          </div>
        </div>
      </div>

      <div class="adm-checks">
        <label class="adm-check"><input type="checkbox" name="featured"> Destacado (aparece en el inicio)</label>
        <label class="adm-check"><input type="checkbox" name="soldOut"> Marcar como agotado</label>
        <label class="adm-check"><input type="checkbox" name="active" checked> Visible en la tienda</label>
      </div>

      <p class="form-error" id="p-form-error" role="alert"></p>
      <div class="adm-dialog-actions">
        <button class="btn btn-line" type="button" id="p-cancel">Cancelar</button>
        <button class="btn btn-red" type="submit">Guardar producto</button>
      </div>
    </form>
  </dialog>
</body>
</html>
