<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Productos de blanquería: sábanas, acolchados, toallas y más | Rincón de Sueño</title>
  <meta name="description" content="Catálogo online de Rincón de Sueño: sábanas, acolchados y edredones, almohadas, toallas, cortinas, mantelería y ropa de cama infantil. Agregá al carrito y pedí online.">
  <meta name="robots" content="index,follow">
  <meta name="theme-color" content="#26201d">
  <link rel="icon" type="image/png" href="assets/logo/favicon.png">
  <link rel="apple-touch-icon" href="assets/logo/apple-touch-icon.png">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="es_AR">
  <meta property="og:title" content="Productos de blanquería: sábanas, acolchados, toallas y más | Rincón de Sueño">
  <meta property="og:description" content="Catálogo online de Rincón de Sueño: sábanas, acolchados y edredones, almohadas, toallas, cortinas, mantelería y ropa de cama infantil. Agregá al carrito y pedí online.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Nunito+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/config.js" defer></script>
  <script src="js/products-data.js" defer></script>
  <script src="js/store.js" defer></script>
  <script src="js/layout.js" defer></script>
  <script src="js/script.js" defer></script>
</head>
<body data-page="productos">
  <a class="skip-link" href="#contenido">Ir al contenido</a>
  <header class="site-header" id="site-header"></header>
  <main id="contenido">
    <section class="page-head">
      <div class="container">
        <h1 id="catalog-title">Productos</h1>
        <div class="page-head-row">
          <p class="lead">Sábanas, acolchados, almohadas, toallas, cortinas y mantelería para tu hogar.</p>
          <button class="btn btn-red btn-share" type="button" id="share-catalog"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 3v12M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>Compartir catálogo</button>
        </div>
      </div>
    </section>
    <section class="page-body" aria-label="Catálogo de productos">
      <div class="container">
        <form class="toolbar" id="catalog-search-form" role="search">
          <div class="search">
            <svg class="ico" aria-hidden="true"><use href="#i-search"/></svg>
            <label class="sr-only" for="catalog-search">Buscar productos</label>
            <input id="catalog-search" type="search" placeholder="Buscar producto" autocomplete="off" enterkeyhint="search">
          </div>
          <div>
            <label class="sr-only" for="catalog-sort">Ordenar por</label>
            <select class="select" id="catalog-sort">
              <option value="destacados">Destacados</option>
              <option value="precio-asc">Menor precio</option>
              <option value="precio-desc">Mayor precio</option>
              <option value="nombre">Nombre (A–Z)</option>
            </select>
          </div>
        </form>
        <div class="chips" id="category-chips" role="group" aria-label="Categorías"></div>
        <div class="attr-filters" id="attr-filters"></div>
        <p class="result-count" id="catalog-count" aria-live="polite"></p>
        <div class="product-grid" id="catalog-grid"></div>
      </div>
    </section>
  </main>
  <footer class="site-footer" id="site-footer"></footer>
</body>
</html>
